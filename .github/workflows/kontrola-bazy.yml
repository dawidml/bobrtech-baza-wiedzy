name: Kontrola bazy wiedzy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  kontrola:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Nagłówki, ID, ścieżki, jedno źródło cen
        run: python narzedzia/sprawdz_baze.py
      - name: INDEX.md i index.jsonl aktualne
        run: |
          python narzedzia/zbuduj_indeks.py
          git diff --exit-code -- INDEX.md index.jsonl '*/INDEX.md'
      - name: Podgląd tekstowy docx/xlsx/pptx aktualny
        run: python narzedzia/podglad_tekstowy.py --sprawdz
